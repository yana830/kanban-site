version: '3.8'

services:
  db:
    image: postgres:15
    container_name: kanban_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: kanban_backend
    restart: unless-stopped
    ports:
      - "3001:3001" # Порт сервера
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules
    working_dir: /app

volumes:
  pgdata: